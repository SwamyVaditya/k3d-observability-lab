# 5B-1: Resource Limits & Requests
# Apply via: kubectl -n monitoring apply -f 01-resource-limits.yaml
# Or: kubectl patch deployment <name> -n monitoring --patch-file ...
# Recommended: add these to your Helm values or as Kustomize patches
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: cart
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: checkout
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: frontendproxy
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 600Mi

