prometheus:
  prometheusSpec:
    # This is the fix for the "Connection Refused" from Alloy
    enableRemoteWriteReceiver: true 
    resources:
      requests:
        memory: "512Mi"
      limits:
        memory: "1024Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "1Gi"

    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    #enableFeatures:
    #  - exemplar-storage
    tsdb:
      outOfOrderTimeWindow: 2h
    retention: 10d

    
    # Optional: skip WAL replay on next start if corrupted
    # walCompression: true

# In apps/monitoring/prometheus-app.yaml sources[0].helm.valueFiles override OR inline:

# disabled for local k3d to save RAM and avoid bootstrap race - enable in prod. 
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  

grafana:
  adminPassword: admin
    
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      searchNamespace: monitoring
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      url: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true  # <-- only ONE default
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartShift: '-1h'
          spanEndShift: '1h'
          filterByTraceID: true
          filterBySpanID: false
          customQuery: true
          query: '{service_name=~".+"} | json | traceid="${__trace.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
  
  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"

    

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url
    templates:
    - '/etc/alertmanager/config/*.tmpl'
    route:
      group_by: ['alertname', 'slo', 'severity']
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 4h
      receiver: 'slack-sre'
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
      - receiver: 'null'
        matchers:
          - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
    receivers:
      - name: 'null'
      - name: 'slack-sre'
        slack_configs:
        - channel: '#alerts-sre'
          send_resolved: true
          title: '{{ if eq .Status "firing" }}:rotating_light: [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ len .Alerts }}x){{ else }}:white_check_mark: [RESOLVED] {{ .GroupLabels.alertname }}{{ end }}'
          text: |-
            {{ range .Alerts }}
            • *{{ .Labels.severity }} | slo={{ .Labels.slo }} | team={{ .Labels.team }}*
            _{{ .Annotations.summary }}_
            {{ .Annotations.description }}
            {{ end }}

  alertmanagerSpec:
    secrets:
    - alertmanager-slack
    resources:
      requests:
        cpu: 10m
        memory: 75Mi
      limits:
        cpu: 100m
        memory: 300Mi

  


# Tighten these up for your 8GB machine
prometheus-node-exporter:
  resources:
    limits:
      memory: "100Mi"
kube-state-metrics:
  resources:
    limits:
      memory: "100Mi"

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
etcd:
  enabled: false
