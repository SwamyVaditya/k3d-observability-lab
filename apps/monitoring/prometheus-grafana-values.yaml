prometheus:
  prometheusSpec:
    # This is the fix for the "Connection Refused" from Alloy
    enableRemoteWriteReceiver: true 
    resources:
      requests:
        memory: "256Mi"
      limits:
        memory: "512Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "1Gi"

# In apps/monitoring/prometheus-app.yaml sources[0].helm.valueFiles override OR inline:

# disabled for local k3d to save RAM and avoid bootstrap race - enable in prod. 
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  

grafana:
  adminPassword: admin
  # Explicitly setting the default datasource to prevent the "Multiple Defaults" crash
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false # Change this to false
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      searchNamespace: monitoring
  # auto-create datasources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100

  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"

    

# Disable Alertmanager to save another ~200MB of RAM
alertmanager:
  enabled: true
  config:
    route:
      receiver: slack
  alertmanagerSpec:
    resources:
      limits: { memory: 150Mi }


# Disable Admission Webhooks - Recommended for Local Labs
#prometheusOperator:
#  admissionWebhooks:
#    enabled: false

# Tighten these up for your 8GB machine
prometheus-node-exporter:
  resources:
    limits:
      memory: "100Mi"
kube-state-metrics:
  resources:
    limits:
      memory: "100Mi"
