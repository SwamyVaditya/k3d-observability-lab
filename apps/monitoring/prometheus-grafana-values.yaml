prometheus:
  prometheusSpec:
    # This is the fix for the "Connection Refused" from Alloy
    enableRemoteWriteReceiver: true 
    resources:
      requests:
        memory: "256Mi"
      limits:
        memory: "512Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "1Gi"

    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    enableFeatures:
      - exemplar-storage
    tsdb:
      outOfOrderTimeWindow: 30m

    
    # Optional: skip WAL replay on next start if corrupted
    # walCompression: true

# In apps/monitoring/prometheus-app.yaml sources[0].helm.valueFiles override OR inline:

# disabled for local k3d to save RAM and avoid bootstrap race - enable in prod. 
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  

grafana:
  adminPassword: admin
    
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      searchNamespace: monitoring
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      url: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true  # <-- only ONE default
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartShift: '-1h'
          spanEndShift: '1h'
          filterByTraceID: true
          filterBySpanID: false
          customQuery: true
          query: '{service_name=~".+"} | json | traceid="${__trace.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
  
  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"

    

# Disable Alertmanager to save another ~200MB of RAM
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'service_name']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack'
      routes:
        - match:
          severity: critical
          receiver: 'slack-critical'
      receivers:
        - name: 'slack'
          slack_configs:
        - api_url: 'YOUR_SLACK_WEBHOOK_URL'
          channel: '#alerts-warning'
          send_resolved: true
          title: '[{{.Status | toUpper }}] {{.GroupLabels.alertname }}'
          text: "{{ range.Alerts }}{{.Annotations.summary }}\n{{.Annotations.description }}{{ end }}"
        - name: 'slack-critical'
          slack_configs:
          - api_url: 'YOUR_SLACK_WEBHOOK_URL'
          channel: '#alerts-critical'
          send_resolved: true

  alertmanagerSpec:
    resources:
      limits: { memory: 150Mi }


# Tighten these up for your 8GB machine
prometheus-node-exporter:
  resources:
    limits:
      memory: "100Mi"
kube-state-metrics:
  resources:
    limits:
      memory: "100Mi"
