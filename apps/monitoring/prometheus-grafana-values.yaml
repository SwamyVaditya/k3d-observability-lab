prometheus:
  prometheusSpec:
    # This is the fix for the "Connection Refused" from Alloy
    enableRemoteWriteReceiver: true 
    resources:
      requests:
        memory: "256Mi"
      limits:
        memory: "512Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "1Gi"
    # Fixes WAL corruption after hard shutdown
    additionalArgs:
      - name: storage.tsdb.allow-overlapping-chunks
        value: "true"
    # Optional: skip WAL replay on next start if corrupted
    # walCompression: true

# In apps/monitoring/prometheus-app.yaml sources[0].helm.valueFiles override OR inline:

# disabled for local k3d to save RAM and avoid bootstrap race - enable in prod. 
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  

grafana:
  adminPassword: admin
  # Explicitly setting the default datasource to prevent the "Multiple Defaults" crash
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false # Change this to false
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      searchNamespace: monitoring
      provider:
        foldersFromFilesStructure: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'sidecarProvider'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /tmp/dashboards
            foldersFromFilesStructure: true
  # auto-create datasources
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      # optional but good for trace->logs correlation
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartShift: '-1h'
          spanEndShift: '1h'
          filterByTraceID: true
          filterBySpanID: false
          customQuery: true
          query: '{service_name=~".+"} | json | traceid="${__trace.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
  
  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"

    

# Disable Alertmanager to save another ~200MB of RAM
alertmanager:
  enabled: true
  config:
    route:
      receiver: slack
  alertmanagerSpec:
    resources:
      limits: { memory: 150Mi }


# Disable Admission Webhooks - Recommended for Local Labs
#prometheusOperator:
#  admissionWebhooks:
#    enabled: false

# Tighten these up for your 8GB machine
prometheus-node-exporter:
  resources:
    limits:
      memory: "100Mi"
kube-state-metrics:
  resources:
    limits:
      memory: "100Mi"
