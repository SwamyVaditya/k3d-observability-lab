apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability-lab
  sources:
    # Source 1: The remote OpenTelemetry Helm chart repository
    - chart: opentelemetry-demo
      repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      targetRevision: 0.40.10
      helm:
        valueFiles:
          - $GitRepo/apps/monitoring/otel-demo-values.yaml
          
    # Source 2: Your Git repository containing the custom values file
    - repoURL: https://github.com/swamyvaditya/k3d-observability-lab.git
      targetRevision: main
      ref: GitRepo

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
      
  syncPolicy:
    automated:
      prune: true
      selfHeal: true