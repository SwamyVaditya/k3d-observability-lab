apiVersion: v1
kind: ConfigMap
metadata:
  name: 02-infra-k8s-use
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  infra-k8s-use.json: |-
    {
      "title": "02 - Infra K8s USE",
      "uid": "infra-k8s-use",
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": [
        "phase2",
        "sre",
        "golden-signals"
      ],
      "panels": [
        {
          "type": "stat",
          "title": "Pods Not Ready",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase!='Running'})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total[1h])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "PVC Usage %",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes *100",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Kubelet Saturation",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "expr": "rate(kubelet_pod_start_duration_seconds_count[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
