apiVersion: v1
kind: ConfigMap
metadata:
  name: 06-traces
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  traces-tempo.json: |-
    {
      "title": "06 - Traces - Tempo + Loki",
      "uid": "traces-tempo",
      "panels": [
        {
          "type": "traces",
          "title": "Tempo - Trace Search - Cart",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"query": "{resource.service.name=\"cart\"}"}]
        },
        {
          "type": "traces",
          "title": "Tempo - Trace Search - Frontend",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 10},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"query": "{resource.service.name=\"frontend\"}"}]
        },
        {
          "type": "timeseries",
          "title": "Request Rate by Service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (service_name) (rate({service_name=~\".+\"}))"}]
        },
        {
          "type": "logs",
          "title": "Logs with trace_id - Cart",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"cart\"} | json | traceid!= \"\""}]
        }
      ]
    }