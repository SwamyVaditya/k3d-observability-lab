apiVersion: v1
kind: ConfigMap
metadata:
  name: 06-traces
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  traces-tempo.json: |-
    {
      "title": "06 - Traces - Tempo + Loki",
      "uid": "traces-tempo",
      "panels": [
        {
          "type": "traces",
          "title": "Tempo - Trace Search",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{"query": "{.service.name = \"frontend\" } | select(status)","refId":"A"}]
        },
        {
          "type": "timeseries",
          "title": "Trace Rate by Service (from Metrics)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (service) (rate(http_server_requests_seconds_count))","refId":"A"}]
        },
        {
          "type": "logs",
          "title": "Logs with Trace Correlation",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"monitoring\"} | trace_id!=\"\"","refId":"A"}]
        }
      ]
    }