apiVersion: v1
kind: ConfigMap
metadata:
  name: 06-traces
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  traces-tempo.json: |-
{
      "title": "06 - Traces - Tempo + Loki",
      "uid": "traces-tempo",
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": [
        "phase2",
        "sre",
        "golden-signals"
      ],
      "panels": [
        {
          "type": "traces",
          "title": "Tempo - Trace Search",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "query": "{}",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Traces Rate by Service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum by(service)(rate(http_server_requests_seconds_count[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "logs",
          "title": "Correlated Logs (with trace_id)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "{namespace=\"monitoring\"} | json | trace_id != \"\"",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ]
        }
      ]
    }
