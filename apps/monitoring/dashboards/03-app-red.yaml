apiVersion: v1
kind: ConfigMap
metadata:
  name: 03-app-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  app-red.json: |-
    {
      "title": "03 - App RED - shop.local",
      "uid": "app-red",
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": [
        "phase2",
        "sre",
        "golden-signals"
      ],
      "panels": [
        {
          "type": "stat",
          "title": "Total Request Rate (RPS)",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Error Rate %",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))/sum(rate(http_server_requests_seconds_count[5m]))*100",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "P95 Latency",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by(le)(rate(http_server_requests_seconds_bucket[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "RED - Rate by Service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum by(service)(rate(http_server_requests_seconds_count[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "RED - Errors by Service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum by(service)(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "RED - Duration P95 by Service",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by(le, service)(rate(http_server_requests_seconds_bucket[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
