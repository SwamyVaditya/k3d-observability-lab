apiVersion: v1
kind: ConfigMap
metadata:
  name: 03-app-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  app-red.json: |-
    {
      "title": "03 - App RED - shop.local",
      "uid": "app-red",
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": ["phase2","sre","golden-signals"],
      "panels": [
        {
          "type": "stat",
          "title": "Total Request Rate (RPS) - Frontend",
          "gridPos": {"h":4,"w":8,"x":0,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum(rate(app_frontend_requests_total[5m])) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "No traffic"}}
        },
        {
          "type": "stat",
          "title": "Error Rate % - Frontend",
          "gridPos": {"h":4,"w":8,"x":8,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum(rate(app_frontend_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(app_frontend_requests_total[5m])),1) * 100 or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "percent", "noValue": "No traffic", "thresholds": {"steps": [{"color":"green","value":0},{"color":"yellow","value":1},{"color":"red","value":5}]}}}
        },
        {
          "type": "stat",
          "title": "P95 Latency - cart (golden)",
          "gridPos": {"h":4,"w":8,"x":16,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "slo:cart:p95_latency:5m * 1000"}],
          "fieldConfig": {"defaults": {"unit": "ms", "noValue": "No cart traffic - idle"}}
        },
        {
          "type": "timeseries",
          "title": "RED - Rate by HTTP Target (Frontend)",
          "gridPos": {"h":8,"w":12,"x":0,"y":4},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum by(target) (rate(app_frontend_requests_total[5m]))"}]
        },
        {
          "type": "timeseries",
          "title": "RED - Errors by HTTP Target (Frontend)",
          "gridPos": {"h":8,"w":12,"x":12,"y":4},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum by(target) (rate(app_frontend_requests_total{status=~\"5..\"}[5m]))"}]
        },
        {
          "type": "timeseries",
          "title": "RED - Duration P95 by Job (Backend)",
          "gridPos": {"h":8,"w":24,"x":0,"y":12},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by(le, job) (rate(http_server_request_duration_seconds_bucket[5m]))) * 1000", "legendFormat": "{{job}} p95"}],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        }
      ]
    }