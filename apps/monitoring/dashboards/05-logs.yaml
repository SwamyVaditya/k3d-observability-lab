apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  logs-loki.json: |-
    {
      "title": "05 - Logs - Loki",
      "uid": "logs-loki",
      "panels": [
        {
          "type": "logs",
          "title": "All Service Logs (Loki)",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"monitoring\"}","refId":"A"}],
          "options": {"showTime": true, "sortOrder": "Descending", "dedupStrategy": "none"}
        },
        {
          "type": "timeseries",
          "title": "Error Logs Rate - by service",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by (app) (rate({namespace=\"monitoring\"} |= \"error\" ))","refId":"A"}]
        },
        {
          "type": "logs",
          "title": "Cart Service Logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{app=\"cart\"}","refId":"A"}]
        },
        {
          "type": "logs",
          "title": "Checkout Service Logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{app=\"checkout\"}","refId":"A"}]
        }
      ]
    }