apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  logs-loki.json: |-
    {
      "title": "05 - Logs - Loki",
      "uid": "logs-loki",
      "panels": [
        {
          "type": "logs",
          "title": "All Service Logs (Loki)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=~\".+\"}", "refId": "A"}]
        },
        {
          "type": "timeseries",
          "title": "Logs Rate by Service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "rate({service_name=~\".+\"}[1m])", "refId": "A"}]
        },
        {
          "type": "timeseries",
          "title": "Error Logs Rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "rate({level=\"ERROR\"}[1m])", "refId": "A"}]
        },
        {
          "type": "logs",
          "title": "Cart Logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"cart\"}", "refId": "A"}]
        },
        {
          "type": "logs",
          "title": "Frontend Logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"otel-demo\"} |= \"frontend\"", "refId": "A"}]
        },
        {
          "type": "logs",
          "title": "Checkout Logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"otel-demo\"} |= \"checkout\"", "refId": "A"}]
        }
      ]
    }