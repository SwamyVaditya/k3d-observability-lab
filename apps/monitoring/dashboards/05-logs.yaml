apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  logs-loki.json: |-
    {
      "title": "05 - Logs - Loki",
      "uid": "logs-loki",
      "panels": [
        {
          "type": "logs",
          "title": "All Service Logs (Loki)",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=~\".+\"}"}],
          "options": {"showTime": true}
        },
        {
          "type": "timeseries",
          "title": "Logs Rate by Service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by (service_name) (rate({service_name=~\".+\"}))"}]
        },
        {
          "type": "timeseries",
          "title": "Error Logs Rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"expr": "sum by (service_name) (rate({level=\"ERROR\"}))", "legendFormat": "{{service_name}} - ERROR"},
            {"expr": "sum by (level) (rate({service_name=~\".+\"}))", "legendFormat": "level={{level}}"}
          ]
        },
        {
          "type": "logs",
          "title": "Cart Logs - service_name=cart",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 18},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"cart\"}"}]
        },
        {
          "type": "logs",
          "title": "Frontend Logs - inside otel-demo",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 18},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"otel-demo\"} | json | instrumentation_scope_name=\"frontend\""}]
        },
        {
          "type": "logs",
          "title": "Checkout Logs (has kafka ERROR)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 26},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"otel-demo\"} | json | instrumentation_scope_name=\"checkout\""}]
        }
      ]
    }