apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  logs-loki.json: |-
    {
      "title": "05 - Logs - Loki",
      "uid": "logs-loki",
      "panels": [
        {
          "type": "logs",
          "title": "All Service Logs (Loki)",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=~\".+\"}","refId":"A"}],
          "options": {"showTime": true, "sortOrder": "Descending"}
        },
        {
          "type": "timeseries",
          "title": "Logs Rate by Service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by (service_name) (rate({service_name=~\".+\"}))"}]
        },
        {
          "type": "timeseries",
          "title": "Error Logs Rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by (service_name) (rate({service_name=~\".+\"} |= \"error\" ))"}]
        },
        {
          "type": "logs",
          "title": "Cart Logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 18},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"cart\"}"}]
        },
        {
          "type": "logs",
          "title": "Frontend Logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 18},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"frontend\"}"}]
        }
      ]
    }