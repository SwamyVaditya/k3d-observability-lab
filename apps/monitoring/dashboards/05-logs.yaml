apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  logs-loki.json: |-
    {
      "title": "05 - Logs - Loki",
      "uid": "logs-loki",
      "panels": [
        {
          "type": "logs",
          "title": "All Service Logs (Loki)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=~\".+\"}"}]
        },
        {
          "type": "timeseries",
          "title": "Logs Rate by Service - Metric Query",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum by (service_name) (rate({service_name=~\".+\"}))", "queryType": "range"}]
        },
        {
          "type": "timeseries",
          "title": "Error Logs Rate - level=ERROR",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "rate({level=\"ERROR\"})", "queryType": "range"}]
        },
        {
          "type": "logs",
          "title": "Cart Logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"cart\"}"}]
        },
        {
          "type": "logs",
          "title": "Frontend Logs - using contains",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"otel-demo\"} |= \"frontend\""}]
        },
        {
          "type": "logs",
          "title": "Checkout Logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{service_name=\"otel-demo\"} |= \"checkout\""}]
        }
      ]
    }