apiVersion: v1
kind: ConfigMap
metadata:
  name: 04-app-business
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  app-business.json: |-
    {
      "title": "04 - App Business KPIs",
      "uid": "app-business",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "Checkout Rate (Place Order) - 500 = kafka disabled",
          "gridPos": {"h":8,"w":12,"x":0,"y":0},
          "targets": [{
            "expr": "sum by(status)(rate(app_frontend_requests_total{target=\"/api/checkout\"}[5m]))",
            "datasource":{"type":"prometheus","uid":"prometheus"}
          }]
        },
        {
          "type": "timeseries",
          "title": "Cart Operations",
          "gridPos": {"h":8,"w":12,"x":12,"y":0},
          "targets": [{
            "expr": "sum by(target, method)(rate(app_frontend_requests_total{target=~\"/api/cart.*\"}[5m]))",
            "datasource":{"type":"prometheus","uid":"prometheus"}
          }]
        },
        {
          "type": "timeseries",
          "title": "Cart Service gRPC - AddItem / GetCart",
          "gridPos": {"h":8,"w":12,"x":0,"y":8},
          "targets": [{
            "expr": "sum by(http_route)(rate(http_server_request_duration_seconds_count{job=\"cart\"}[5m]))",
            "datasource":{"type":"prometheus","uid":"prometheus"}
          }]
        },
        {
          "type": "timeseries",
          "title": "Checkout Failures vs Success",
          "gridPos": {"h":8,"w":12,"x":12,"y":8},
          "targets": [
            {"expr": "sum(rate(app_frontend_requests_total{target=\"/api/checkout\",status=\"500\"}[5m]))","datasource":{"type":"prometheus","uid":"prometheus"}},
            {"expr": "sum(rate(app_frontend_requests_total{target=\"/api/checkout\",status=\"200\"}[5m]))","datasource":{"type":"prometheus","uid":"prometheus"}}
          ]
        }
      ]
    }