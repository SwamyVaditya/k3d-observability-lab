apiVersion: v1
kind: ConfigMap
metadata:
  name: 04-app-business
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  app-business.json: |-
{
      "title": "04 - App Business KPIs",
      "uid": "app-business",
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": [
        "phase2",
        "sre",
        "golden-signals"
      ],
      "panels": [
        {
          "type": "timeseries",
          "title": "Checkout Rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=\"checkout\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Cart Operations",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=\"cart\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Payment Latency",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by(le)(rate(http_server_requests_seconds_bucket{service=\"payment\"}[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Frontend Availability",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "up{job=~\".*frontend.*\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
