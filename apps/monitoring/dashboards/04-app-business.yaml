apiVersion: v1
kind: ConfigMap
metadata:
  name: 04-app-business
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  app-business.json: |-
    {
      "title": "04 - App Business KPIs",
      "uid": "app-business",
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": ["phase2","sre","golden-signals"],
      "panels": [
        {
          "type": "timeseries",
          "title": "Checkout Rate (by status)",
          "gridPos": {"h":8,"w":12,"x":0,"y":0},
          "targets": [{"expr": "sum by(http_status_code)(rate(http_server_duration_milliseconds_count{job=\"otel-demo\",http_target=~\".*checkout.*\"}[5m]))","datasource":{"type":"prometheus","uid":"prometheus"}}]
        },
        {
          "type": "timeseries",
          "title": "Cart Operations",
          "gridPos": {"h":8,"w":12,"x":12,"y":0},
          "targets": [{"expr": "sum by(http_method)(rate(http_server_duration_milliseconds_count{job=\"otel-demo\",http_target=~\".*cart.*\"}[5m]))","datasource":{"type":"prometheus","uid":"prometheus"}}]
        },
        {
          "type": "timeseries",
          "title": "Error Rate by Target (Payment/Checkout fail = kafka disabled)",
          "gridPos": {"h":8,"w":12,"x":0,"y":8},
          "targets": [{"expr": "sum by(http_target)(rate(http_server_duration_milliseconds_count{job=\"otel-demo\",http_status_code=~\"5..\"}[5m]))","datasource":{"type":"prometheus","uid":"prometheus"}}]
        },
        {
          "type": "timeseries",
          "title": "Frontend Availability - HTTP 200 vs 500",
          "gridPos": {"h":8,"w":12,"x":12,"y":8},
          "targets": [{"expr": "sum by(http_status_code)(rate(http_server_duration_milliseconds_count{job=\"otel-demo\"}[5m]))","datasource":{"type":"prometheus","uid":"prometheus"}}]
        }
      ]
    }