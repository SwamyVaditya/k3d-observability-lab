apiVersion: v1
kind: ConfigMap
metadata:
  name: 04-app-business
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  app-business.json: |-
    {
      "title": "04 - App Business KPIs",
      "uid": "app-business",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "Checkout Rate (Place Order) - 500 indicates kafka/queue failure",
          "gridPos": {"h":8,"w":12,"x":0,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum by(status) (rate(app_frontend_requests_total{target=~\".*checkout.*\"}[5m]))", "legendFormat": "status={{status}}"}]
        },
        {
          "type": "timeseries",
          "title": "Cart Operations",
          "gridPos": {"h":8,"w":12,"x":12,"y":0},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum by(target, method) (rate(app_frontend_requests_total{target=~\".*cart.*\"}[5m]))", "legendFormat": "{{method}} {{target}}"}]
        },
        {
          "type": "timeseries",
          "title": "Cart Service gRPC - AddItem / GetCart",
          "gridPos": {"h":8,"w":12,"x":0,"y":8},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{"expr": "sum by(http_route) (rate(http_server_request_duration_seconds_count{job=\"cart\"}[5m]))", "legendFormat": "{{http_route}}"}]
        },
        {
          "type": "timeseries",
          "title": "Checkout Failures vs Success (honest regex)",
          "gridPos": {"h":8,"w":12,"x":12,"y":8},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [
            {"expr": "sum(rate(app_frontend_requests_total{target=~\".*checkout.*\",status=\"500\"}[5m]))", "legendFormat": "500 failures"},
            {"expr": "sum(rate(app_frontend_requests_total{target=~\".*checkout.*\",status=\"200\"}[5m]))", "legendFormat": "200 success"}
          ]
        }
      ]
    }