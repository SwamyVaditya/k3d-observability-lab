apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-demo
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchExpressions:
      - key: opentelemetry.io/name
        operator: Exists
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
    # otel-demo services expose metrics on /metrics but some use different port names
    # This covers both http and grpc
    - port: grpc
      path: /metrics
      interval: 15s
      honorLabels: true
---
# Also scrape the collector itself
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-demo-otelcol
  endpoints:
    - port: http
      path: /metrics
      interval: 15s