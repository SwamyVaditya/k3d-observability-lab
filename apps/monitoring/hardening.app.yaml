# apps/platform/hardening.app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-hardening
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: observability-lab
  source:
    repoURL: https://github.com/SwamyVaditya/k3d-observability-lab
    path: apps/platform/hardening
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }