apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    # Source 1: The remote Grafana Loki Helm chart repository
    - chart: loki
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 5.43.0
      helm:
        valueFiles:
          - $GitRepo/apps/monitoring/loki-values.yaml
  
  # Source 2: Your Git repository containing the custom values file
    - repoURL: https://github.com/swamyvaditya/k3d-observability-lab.git
      targetRevision: main
      ref: GitRepo
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true