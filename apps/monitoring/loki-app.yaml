apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability-lab
  sources:
    # Source 1: The Loki / Grafana helm chart
    - chart: loki
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 6.6.2 # latest stable singleBinary
      helm:
        valueFiles:
          - $GitRepo/apps/monitoring/loki-values.yaml
    
    # Source 2: Your Git repository reference
    - repoURL: https://github.com/SwamyVaditya/k3d-observability-lab.git
      targetRevision: main
      ref: GitRepo
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    #  - Replace=true