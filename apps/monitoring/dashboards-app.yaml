apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: observability-lab
  sources:
    - repoURL: https://github.com/SwamyVaditya/k3d-observability-lab.git
      targetRevision: main
      path: apps/monitoring/dashboards
    
    - repoURL: https://github.com/SwamyVaditya/k3d-observability-lab.git
      targetRevision: main
      path: apps/monitoring/slos
      
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true