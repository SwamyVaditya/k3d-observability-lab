# --- ROOT LEVEL SUB-CHARTS ---
# These are independent apps bundled with the demo. 
# Disabling these saves ~3GB of RAM.
opentelemetry-collector: { enabled: false }
opensearch: { enabled: false }
prometheus: { enabled: false }
grafana: { enabled: false }
jaeger: { enabled: false }

# --- COMPONENTS (MICROSERVICES) ---
# We keep only the bare essentials to see the shop.
components:
  accounting: { enabled: false }
  ad: { enabled: false }
  recommendation: { enabled: false }
  load-generator: { enabled: false }
  
  fraud-detection: 
    enabled: false
    initContainers: []
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 400Mi }

  # Kafka, PostgreSQL, and Valkey blocks are removed here.
  # The chart will use its internal defaults, preventing the schema validation failure.
  kafka:
    enabled: true
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 800Mi }

  cart:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 160Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 7070 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 7070 }
      initialDelaySeconds: 5
      periodSeconds: 5

  checkout:
    initContainers: [] 
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 5050 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 5050 }
      initialDelaySeconds: 5
      periodSeconds: 5

  currency:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 7000 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 7000 }
      initialDelaySeconds: 5
      periodSeconds: 5

  email:
    resources:
      requests: { cpu: 30m, memory: 64Mi }
      limits: { cpu: 200m, memory: 150Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 8080 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 8080 }
      initialDelaySeconds: 5
      periodSeconds: 5
  
  frontend:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 350Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 8080 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 8080 }
      initialDelaySeconds: 5
      periodSeconds: 5

  frontend-proxy:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
    livenessProbe:
      httpGet: { path: /, port: 8001 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /, port: 8001 }
      initialDelaySeconds: 5
      periodSeconds: 5

  image-provider:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8081 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /healthz, port: 8081 }
      initialDelaySeconds: 5
      periodSeconds: 5

  payment:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 200Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 50051 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 50051 }
      initialDelaySeconds: 5
      periodSeconds: 5

  product-catalog:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 3550 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 3550 }
      initialDelaySeconds: 5
      periodSeconds: 5

  product-reviews:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 200m, memory: 150Mi }
    livenessProbe:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 5
      periodSeconds: 5

  quote:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 8080 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 8080 }
      initialDelaySeconds: 5
      periodSeconds: 5

  shipping:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
    livenessProbe:
      httpGet: { path: /_healthz, port: 50051 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /_healthz, port: 50051 }
      initialDelaySeconds: 5
      periodSeconds: 5

  flagd:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }
    livenessProbe:
      httpGet: { path: /readyz, port: 8013 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8013 }
      initialDelaySeconds: 5
      periodSeconds: 5

  postgresql:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }

  valkey-cart:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }

  llm:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /, port: 8000 }
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /, port: 8000 }
      initialDelaySeconds: 5
      periodSeconds: 5


# --- GLOBAL CONFIG ---
default:
  env:
    - name: OTEL_SERVICE_NAME
      value: "otel-demo"
    # TRICK THE CHART: The chart automatically appends ':4317' to this variable.
    # By providing the FQDN here, it stitches together perfectly without variable collisions.
    - name: OTEL_COLLECTOR_NAME
      value: "alloy.monitoring.svc.cluster.local" # Fixes the Nginx $(OTEL_COLLECTOR_NAME) error
    - name: WAIT_FOR_KAFKA
      value: "false"
    - name: WAIT_FOR_OPENSEARCH
      value: "false"
