# --- ROOT LEVEL SUB-CHARTS ---
# These are independent apps bundled with the demo. 
# Disabling these saves ~3GB of RAM.
opentelemetry-collector: { enabled: false }
opensearch: { enabled: false }
prometheus: { enabled: false }
grafana: { enabled: false }
jaeger: { enabled: false }

# --- COMPONENTS (MICROSERVICES) ---
# We keep only the bare essentials to see the shop.
components:
  accounting: { enabled: false }
  ad: { enabled: false }
  recommendation: { enabled: false }
  load-generator: { enabled: false }
  
  fraud-detection: 
    enabled: false
    initContainers: []
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 400Mi }

  kafka:
    enabled: true
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 800Mi }
    # Let the chart pick the TCP/Exec mechanism, just adjust timings:
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 15
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10

  cart:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 160Mi }
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5

  checkout:
    initContainers: [] 
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 256Mi }
