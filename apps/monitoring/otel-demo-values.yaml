# --- ROOT LEVEL SUB-CHARTS ---
# These are independent apps bundled with the demo. 
# Disabling these saves ~3GB of RAM.
opentelemetry-collector: { enabled: false }
opensearch: { enabled: false }
prometheus: { enabled: false }
grafana: { enabled: false }
jaeger: { enabled: false }

# --- COMPONENTS (MICROSERVICES) ---
# We keep only the bare essentials to see the shop.
components:
  accounting: { enabled: false }
  ad: { enabled: false }
  recommendation: { enabled: false }

  load-generator: 
    enabled: false
  
  fraud-detection: 
    enabled: false
    initContainers: []
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 400Mi } # Java/heavy
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5


  kafka:
    enabled: true
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 800Mi } # was 600Mi, needs headroom
    livenessProbe:
      httpGet:
        path: /
        port: 9092
      initialDelaySeconds: 30
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /
        port: 9092
      initialDelaySeconds: 10
      periodSeconds: 10

  cart:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 160Mi }
    livenessProbe:
