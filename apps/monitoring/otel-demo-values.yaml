# --- ROOT LEVEL SUB-CHARTS ---
# These are independent apps bundled with the demo. 
# We keep only the bare essentials to see the shop.
# Disabling these saves ~3GB of RAM.
opentelemetry-collector: { enabled: false }
opensearch: { enabled: false }
prometheus: { enabled: false }
grafana: { enabled: false }
jaeger: { enabled: false }


# --- COMPONENTS (MICROSERVICES) ---
components:
  accounting: { enabled: false }
  ad: { enabled: false }
  recommendation: { enabled: false }
  load-generator: { enabled: false }
  
  fraud-detection: 
    enabled: false
    initContainers: []
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 400Mi }

  # Satisfies Python CI checking and chart schema constraints
  kafka:
    enabled: true
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 800Mi }
    

  cart:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 160Mi }
  
  checkout:
    initContainers: [] 
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 256Mi }
  
  currency:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }
  
  email:
    resources:
      requests: { cpu: 30m, memory: 64Mi }
      limits: { cpu: 200m, memory: 150Mi }
    
  frontend:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 350Mi }
  
  frontend-proxy:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
  
  image-provider:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
  
  payment:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 200Mi }
  
  product-catalog:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
  
  product-reviews:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 200m, memory: 150Mi }
  
  quote:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
  
  shipping:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
  
  flagd:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }
  
  postgresql:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  
  valkey-cart:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }
  
  llm:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 300m, memory: 256Mi }
  

# --- GLOBAL CONFIG ---
default:
  env:
    - name: OTEL_SERVICE_NAME
      value: "otel-demo"
    # TRICK THE CHART: The chart automatically appends ':4317' to this variable.
    # By providing the FQDN here, it stitches together perfectly without variable collisions.
    - name: OTEL_COLLECTOR_NAME
      value: "alloy.monitoring.svc.cluster.local" # Fixes the Nginx $(OTEL_COLLECTOR_NAME) error
    - name: WAIT_FOR_KAFKA
      value: "false"
    - name: WAIT_FOR_OPENSEARCH
      value: "false"
