# Fix: HTTP is intentionally local-only for k3d lab.
# *.local hosts -> 127.0.0.1 via /etc/hosts, not internet-exposed.
# Production posture: websecure (443) + cert-manager + TLS + WAF/ALB
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-ingresses
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    argocd.argoproj.io/sync-wave: "3"
    hardening.lab/exposure: "local-only - hosts resolve to 127.0.0.1, not internet-exposed"
    hardening.lab/prod-posture: "prod uses websecure:443 + cert-manager + TLS + WAF + private VPC"
spec:
  rules:
  - host: prometheus.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: prometheus-stack-kube-prom-prometheus
              port: { number: 9090 }
  - host: grafana.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: prometheus-stack-grafana
              port: { number: 80 }
  - host: minio-console.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: minio-console
              port: { number: 9001 }
  - host: loki.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: loki
              port: { number: 3100 }
  - host: tempo.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: tempo
              port: { number: 3100 }
  - host: shop.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-proxy
              port: { number: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    argocd.argoproj.io/sync-wave: "3"
    hardening.lab/exposure: "local-only"
    hardening.lab/prod-posture: "prod uses websecure + TLS"
spec:
  rules:
  - host: argocd.local
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: argocd-server
              port: { number: 80 }