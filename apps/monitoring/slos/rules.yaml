apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-demo-slos
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus-stack
spec:
  groups:
    - name: checkout-slo
      interval: 30s
      rules:
        - record: slo:checkout:error_rate:5m
          expr: |
            sum(rate(app_frontend_requests_total{target="/api/checkout",status="500"}[5m]))
            /
            (sum(rate(app_frontend_requests_total{target="/api/checkout"}[5m])) + 0.0001)
        - record: slo:checkout:traffic:5m
          expr: sum(rate(app_frontend_requests_total{target="/api/checkout"}[5m]))
        - record: slo:checkout:budget_remaining_percent
          expr: 100 * (1 - slo:checkout:error_rate:5m)
        - record: slo:all:error_rate:5m
          expr: |
            sum(rate(app_frontend_requests_total{status=~"5.."}[5m]))
            /
            (sum(rate(app_frontend_requests_total[5m])) + 0.0001)
        - record: slo:cart:p95_latency:5m
          expr: |
            histogram_quantile(0.95,
              sum by(le) (rate(http_server_request_duration_seconds_bucket{job="cart"}[5m]))
            )

        # --- SLO Alerts ---
        - alert: CheckoutSLOBurning
          expr: slo:checkout:error_rate:5m > 0.005
          for: 2m
          labels:
            severity: critical
            slo: checkout
            team: app
          annotations:
            summary: "Checkout SLO burning - error rate {{ $value | humanizePercentage }} > 0.5% SLO"
            description: "Checkout failure is {{ $value | humanizePercentage }} (budget {{ $value | humanizePercentage }} used). Current value: {{ $value }}. Check: kubectl -n otel-demo get pods | grep kafka"
            runbook_url: "https://github.com/SwamyVaditya/k3d-observability-lab/blob/main/docs/runbooks/checkout-slo-burning.md"

        - alert: CheckoutErrorBudgetExhausted
          expr: slo:checkout:error_rate:5m > 0.02
          for: 5m
          labels:
            severity: page
            slo: checkout
            team: app
          annotations:
            summary: "Checkout error budget exhausted - {{ $value | humanizePercentage }} errors"
            description: "Burn rate 4x SLO ({{ $value | humanizePercentage }}). Immediate action required. Orders failing."

        - alert: CheckoutTrafficAbsent
          expr: slo:checkout:traffic:5m == 0
          for: 15m
          labels:
            severity: warning
            slo: checkout
            team: app
          annotations:
            summary: "No checkout traffic for 15m"

        - alert: CartHighLatency
          expr: slo:cart:p95_latency:5m > 0.5
          for: 5m
          labels:
            severity: warning
            slo: cart
          annotations:
            summary: "Cart p95 latency {{ $value }}s > 500ms"