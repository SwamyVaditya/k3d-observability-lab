apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-demo-slos
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: otel-demo.sli
      interval: 30s
      rules:
        - record: sli:traffic:rate_5m
          expr: sum by (job) (rate(http_server_requests_seconds_count{namespace="otel-demo"}[5m]))

        - record: sli:errors:ratio_rate_5m
          expr: |
            sum by (job) (rate(http_server_requests_seconds_count{namespace="otel-demo",code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{namespace="otel-demo"}[5m]))

        - record: sli:errors:ratio_rate_1h
          expr: |
            sum by (job) (rate(http_server_requests_seconds_count{namespace="otel-demo",code=~"5.."}[1h]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{namespace="otel-demo"}[1h]))

        - record: sli:latency:p95_5m
          expr: histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{namespace="otel-demo"}[5m])))

        - record: sli:saturation:cpu_5m
          expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="otel-demo"}[5m])) * 100

        - record: sli:saturation:memory_percent
          expr: |
            sum by (pod) (container_memory_working_set_bytes{namespace="otel-demo",container!=""} )
            / sum by (pod) (kube_pod_container_resource_limits{namespace="otel-demo",resource="memory"}) * 100

    - name: otel-demo.golden-signals
      interval: 30s
      rules:
        - alert: TrafficDrop
          expr: sli:traffic:rate_5m < 0.1
          for: 5m
          labels: {severity: warning, signal: traffic}
          annotations: {summary: "Traffic dropped for {{ $labels.job }}: {{ $value }} req/s"}
        - alert: HighErrorRate
          expr: sli:errors:ratio_rate_5m > 0.05
          for: 3m
          labels: {severity: critical, signal: errors}
          annotations: {summary: "High error rate {{ $labels.job }}: {{ $value | humanizePercentage }}"}
        - alert: HighLatency
          expr: sli:latency:p95_5m > 0.5
          for: 5m
          labels: {severity: warning, signal: latency}
          annotations: {summary: "High p95 latency {{ $labels.job }}: {{ $value }}s"}
        - alert: HighCpuSaturation
          expr: sli:saturation:cpu_5m > 80
          for: 5m
          labels: {severity: warning, signal: saturation}
          annotations: {summary: "High CPU {{ $labels.pod }}: {{ $value }}%"}
        - alert: HighMemorySaturation
          expr: sli:saturation:memory_percent > 85
          for: 5m
          labels: {severity: critical, signal: saturation}
          annotations: {summary: "High memory {{ $labels.pod }}: {{ $value }}%"}
        - alert: ServiceDown
          expr: up{namespace="otel-demo"} == 0
          for: 2m
          labels: {severity: critical, signal: errors}
          annotations: {summary: "Service down: {{ $labels.job }}"}

    - name: otel-demo.slo-burn-rate
      interval: 30s
      rules:
        - alert: SLOBurnRateFast
          expr: sli:errors:ratio_rate_5m > 0.07 and sli:errors:ratio_rate_1h > 0.07
          for: 2m
          labels: {severity: critical, slo: "99.5%", burn: fast}
          annotations: {summary: "FAST BURN {{ $labels.job }} 14x budget"}
        - alert: SLOBurnRateSlow
          expr: sli:errors:ratio_rate_1h > 0.005
          for: 30m
          labels: {severity: warning, slo: "99.5%", burn: slow}
          annotations: {summary: "SLOW BURN {{ $labels.job }} exceeding 0.5% SLO"}