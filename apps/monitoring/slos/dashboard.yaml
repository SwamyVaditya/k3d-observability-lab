apiVersion: v1
kind: ConfigMap
metadata:
  name: 07-slos
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "SRE"
data:
  slos.json: |-
    {
      "title": "07 - SLOs - 4 Golden Signals + Burn Rate",
      "uid": "slos-prod",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"type":"stat","title":"1. Traffic - req/s (now)","gridPos":{"h":4,"w":6,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(app_frontend_requests_total[5m]))"}]},
        {"type":"stat","title":"2. Errors - Error % (5m)","gridPos":{"h":4,"w":6,"x":6,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"100 * sum(rate(app_frontend_requests_total{status=~\"5..\"}[5m])) / sum(rate(app_frontend_requests_total[5m]))"}],"fieldConfig":{"defaults":{"unit":"percent","thresholds":{"steps":[{"color":"green"},{"color":"yellow","value":1},{"color":"red","value":5}]}}}},
        {"type":"stat","title":"3. Latency - p95 (5m)","gridPos":{"h":4,"w":6,"x":12,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.95, sum by(le)(rate(http_server_request_duration_seconds_bucket{job=\"cart\"}[5m])))"}],"fieldConfig":{"defaults":{"unit":"s"}}},
        {"type":"stat","title":"4. Saturation - Up Services","gridPos":{"h":4,"w":6,"x":18,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr": "count(up == 1)"}],"fieldConfig":{"defaults":{"unit":"short"}}},
        {
          "type":"timeseries",
          "title":"SLO - Error Budget Burn Rate (checkout) - BURNING if > 0.5%",
          "gridPos":{"h":8,"w":12,"x":0,"y":4},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "targets":[
            {"expr":"100 * sum(rate(app_frontend_requests_total{target=\"/api/checkout\",status=\"500\"}[5m])) / sum(rate(app_frontend_requests_total{target=\"/api/checkout\"}[5m]))","legendFormat":"Burn 5m %"},
            {"expr":"100 * sum(rate(app_frontend_requests_total{target=\"/api/checkout\",status=\"500\"}[15m])) / sum(rate(app_frontend_requests_total{target=\"/api/checkout\"}[15m]))","legendFormat":"Burn 15m %"},
            {"expr":"0.5","legendFormat":"SLO 0.5%"}
          ],
          "fieldConfig":{"defaults":{"unit":"percent"}}
        },
        {
          "type":"timeseries",
          "title":"Saturation - Checkout vs Cart RPS",
          "gridPos":{"h":8,"w":12,"x":12,"y":4},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "targets":[
            {"expr":"sum(rate(app_frontend_requests_total{target=\"/api/checkout\"}[5m]))","legendFormat":"checkout RPS"},
            {"expr":"sum(rate(app_frontend_requests_total{target=\"/api/cart\"}[5m]))","legendFormat":"cart RPS"}
          ]
        },
        {
          "type":"stat",
          "title":"Error Budget Remaining (checkout)",
          "gridPos":{"h":8,"w":12,"x":0,"y":12},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "targets":[{"expr":"100 - (100 * sum(rate(app_frontend_requests_total{target=\"/api/checkout\",status=\"500\"}[5m])) / sum(rate(app_frontend_requests_total{target=\"/api/checkout\"}[5m])))"}],
          "fieldConfig":{"defaults":{"unit":"percent"}}
        },
        {
          "type":"timeseries",
          "title":"Current Errors - checkout 500 rate",
          "gridPos":{"h":8,"w":12,"x":12,"y":12},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "targets":[
            {"expr":"sum(rate(app_frontend_requests_total{target=\"/api/checkout\",status=\"500\"}[5m]))","legendFormat":"checkout 500/s"},
            {"expr":"sum(rate(app_frontend_requests_total{target=\"/api/cart\",status=\"200\"}[5m]))","legendFormat":"cart 200/s"}
          ]
        }
      ]
    }