deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  # This is the correct block for persistence in modern Loki charts
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: local-path # Explicitly matching your PVC output

  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootUser
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootPassword


# --- New loki chart 6.x format ---
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  #  path_prefix: /var/loki
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-data
      ruler: loki-data
      admin: loki-data
    s3:
      endpoint: minio.monitoring.svc.cluster.local:9000
      s3ForcePathStyle: true
      insecure: true
  ingester:
    #flush_check_period: 15s   # Check for flushable data every 15 seconds
    chunk_idle_period: 1m
    chunk_retain_period: 30s
  limits_config:
    # fix your earlier error - this goes here in new chart
    allow_structured_metadata: true

  #resources:
  #  requests:
  #    memory: 256Mi
  #  limits:
  #    memory: 1Gi

# Disable components that create unwanted datasources
gateway:
  enabled: false # we use direct loki:3100, not gateway
test:
  enabled: false
monitoring:
  selfMonitoring:
    grafanaAgent:
      installOperator: false
lokiCanary:
  enabled: false

# Disabling unnecessary cache components
# No memcached for k3d
memcached:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
  