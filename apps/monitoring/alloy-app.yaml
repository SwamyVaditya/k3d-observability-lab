apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability-lab
  sources:
    # Source 1: The remote Grafana Alloy Helm chart repository
    - chart: alloy
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 0.9.0
      helm:
        valueFiles:
          - $GitRepo/apps/monitoring/alloy-values.yaml
    
    # Source 2: Your Git repository containing the custom values file
    - repoURL: https://github.com/swamyvaditya/k3d-observability-lab.git
      targetRevision: main
      ref: GitRepo

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true