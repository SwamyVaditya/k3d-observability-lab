# Tempo Single Binary mode is perfect for your local K3d environment
# mode is not present in the official Tempo Helm chart, but it is a valid configuration option for the Tempo binary itself.
mode: singleBinary

# Ensure persistence matches your 1Gi local-path architecture pattern
persistence:
  enabled: true
  size: 1Gi
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce

tempo:
  # OTLP Ingestors are enabled by default, which matches your Alloy config
  # Required for OTel Demo - matches your alloy config
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  

  # Standardize these names so the internal Go SDK auto-detects them
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootUser
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootPassword

  storage:
    trace:
      backend: s3
      wal:
        path: /var/tempo/wal
      s3:
        endpoint: minio.monitoring.svc.cluster.local:9000
        bucket: tempo-data
        insecure: true
        forcepathstyle: true


# Professional configuration for data retention and organization
  ingester:
    max_block_duration: 5m
  
  compactor:
    compaction:
      block_retention: 24h

  # Optional: keep traces searchable longer for demo
  metricsGenerator:
    storage:
      path: /var/tempo/generator/wal
