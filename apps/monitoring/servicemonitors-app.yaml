apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: servicemonitors
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/SwamyVaditya/k3d-observability-lab.git
      targetRevision: main
      path: apps/monitoring/servicemonitors
      
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true