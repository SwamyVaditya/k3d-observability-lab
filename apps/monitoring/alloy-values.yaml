alloy:
  extraPorts:
    - name: "otlp-grpc"
      port: 4317
      targetPort: 4317
      protocol: "TCP"
    - name: "otlp-http"
      port: 4318
      targetPort: 4318
      protocol: "TCP"

  configMap:
    create: true
    content: |
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output {
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
          metrics = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        send_batch_size = 1000
        timeout = "15s" 
        output {
          logs    = [otelcol.exporter.loki.to_loki.input]
          traces  = [otelcol.exporter.otlphttp.to_tempo.input]
          metrics = [otelcol.exporter.prometheus.to_prometheus.input]
        }
      }

      otelcol.exporter.loki "to_loki" {
        forward_to = [loki.write.endpoint.receiver]
      }

      loki.write "endpoint" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // FIX 1: Use otlphttp to tempo on port 3200, not grpc on 4317
      otelcol.exporter.otlphttp "to_tempo" {
        client {
          endpoint = "http://tempo.monitoring.svc.cluster.local:3200/v1/traces"
        }
      }

      otelcol.exporter.prometheus "to_prometheus" {
        forward_to = [prometheus.remote_write.to_prometheus.receiver]
      }

      prometheus.remote_write "to_prometheus" {
        endpoint {
          url = "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }