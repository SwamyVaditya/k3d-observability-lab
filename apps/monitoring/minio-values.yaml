# MinIO is single-node single-disk in this lab (no erasure coding).
# Purpose: demonstrate S3 API integration for Loki/Tempo, not durable HA.
# Data loss = Loki chunks + Tempo blocks lost (like S3 bucket deletion).
# Telemetry pipeline continues, old logs/traces gone, new data flows.
# Production: S3 + versioning + replication, or MinIO distributed 4+ nodes.

# Interview line: "This lab demonstrates telemetry storage integration, not durable object-storage HA."

# Mode: Standalone is the best choice for your K3d single-node experiment
mode: standalone

replicas: 1

persistence:
  enabled: true
  storageClass: "local-path"
  size: 2Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  # It is professional practice to always define limits as well
  limits:
    memory: 512Mi
    cpu: 250m

existingSecret: "minio-credentials"

# Authentication
# Pro-tip: For a production-ready environment, these should be 
# injected via Kubernetes Secrets rather than plain text in a values file.
#accessKey: admin
#secretKey: password

# Professional configuration for observability storage
buckets:
  - name: loki-data
    policy: none
    purge: false
  - name: tempo-data
    policy: none
    purge: false