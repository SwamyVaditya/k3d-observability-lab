apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability-lab
  namespace: argocd
spec:
  description: "Observability lab - monitoring stack"
  sourceRepos:
    - "https://github.com/SwamyVaditya/k3d-observability-lab.git"
    - "https://github.com/swamyvaditya/k3d-observability-lab.git"
    - "https://github.com/SwamyVaditya/k3d-observability-lab"
    - "https://github.com/swamyvaditya/k3d-observability-lab"
    - "https://charts.min.io"
    - "https://grafana.github.io/helm-charts"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://open-telemetry.github.io/opentelemetry-helm-charts"
    - "https://open-telemetry.github.io/opentelemetry-helm"
    - "https://kyverno.github.io/kyverno"

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
#    - namespace: otel-demo
#      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: "*"

  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: rbac.authorization.k8s.io
      kind: "*"
    - group: policy
      kind: "*"
    - group: argoproj.io
      kind: Application
    - group: bitnami.com
      kind: SealedSecret
    - group: monitoring.coreos.com
      kind: "*"
    - group: grafana.integreatly.org
      kind: "*"
    - group: loki.grafana.com
      kind: "*"
    - group: kyverno.io
      kind: "*"

  orphanedResources:
    warn: true